name: Ruby unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby -c zillafurnituretools.rb && ruby -c zillafurnituretools/main.rb && ruby -c zillafurnituretools/planner.rb
      - run: ruby test/test_planner.rb
      - run: python3 tools/build_rbz.py